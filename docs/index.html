<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D Campaign Generator — Wildemount DM Toolkit</title>
  <meta name="description" content="Full Dungeon Master toolkit for Wildemount and Exandria. Procedural maps, live synthesised music, NPC generator, encounter builder, initiative tracker, and deep Wildemount lore — all local, no server.">
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0c0a;
      --surface: #1a1612;
      --surf2:   #221d17;
      --border:  #3d2f22;
      --border2: #2a2118;
      --accent:  #c8973c;
      --gold:    #f0c040;
      --purple:  #8b4c9e;
      --purp2:   #b06ccc;
      --text:    #d4c5a9;
      --muted:   #7d6b55;
      --ok:      #3fb950;
      --warn:    #d29922;
      --crit:    #c84040;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; height: 100vh; overflow: hidden; }

    /* ── Layout ── */
    #app { display: flex; height: 100vh; overflow: hidden; }
    #sidebar {
      width: 256px; flex-shrink: 0; background: var(--surface);
      background-image:
        linear-gradient(180deg, rgba(200,151,60,0.055) 0%, transparent 18%, rgba(0,0,0,0.06) 100%),
        repeating-linear-gradient(90deg, transparent 0, transparent 2px, rgba(255,255,255,0.005) 2px, rgba(255,255,255,0.005) 3px);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    #sidebar::after {
      content:''; position:absolute; top:0; right:0; width:1px; height:100%;
      background: linear-gradient(180deg, rgba(200,151,60,0.25) 0%, rgba(200,151,60,0.08) 12%, transparent 35%, transparent 70%, rgba(200,151,60,0.06) 100%);
      pointer-events:none;
    }
    #main { flex: 1; overflow-y: auto; }
    #content { max-width: 1000px; margin: 0 auto; padding: 28px 28px 80px; }

    /* ── Logo ── */
    #logo { display:flex; align-items:center; gap:12px; padding:20px 16px 16px; border-bottom:1px solid var(--border); flex-shrink:0; }
    #logo-emblem {
      width:40px; height:40px; flex-shrink:0; border-radius:10px; font-size:19px;
      background: linear-gradient(145deg, rgba(200,151,60,0.22) 0%, rgba(200,151,60,0.06) 100%);
      border:1px solid var(--accent-dim, #8a6828);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 0 18px rgba(200,151,60,0.2), inset 0 1px 0 rgba(200,151,60,0.18);
    }
    #logo-wordmark { display:flex; flex-direction:column; gap:2px; min-width:0; }
    #logo-name {
      display:block; font-family:'Cinzel Decorative',serif; font-size:12px; font-weight:700;
      color:var(--accent); line-height:1.2; letter-spacing:0.02em; white-space:nowrap;
      text-shadow: 0 0 26px rgba(200,151,60,0.40), 0 1px 2px rgba(0,0,0,0.6);
    }
    #logo-sub { display:block; font-size:9.5px; color:var(--muted); font-weight:500; letter-spacing:0.11em; text-transform:uppercase; }

    /* ── Sidebar body + section labels ── */
    #sidebar-body { flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:4px; }
    .sb-section-label {
      font-size:9.5px; font-weight:700; color:#52422f; text-transform:uppercase; letter-spacing:0.13em;
      padding:12px 16px 4px; display:flex; align-items:center; gap:8px; user-select:none;
    }
    .sb-section-label::after { content:''; flex:1; height:1px; background:linear-gradient(to right, var(--border), transparent); }
    .camp-select { width:100%; background:var(--surf2); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:12px; cursor:pointer; font-family:inherit; }
    .camp-select:focus { outline:none; border-color:var(--accent); }

    /* ── Nav ── */
    .sidebar-nav { padding:2px 8px; display:flex; flex-direction:column; gap:1px; }
    .nav-item {
      display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
      color:var(--muted); text-decoration:none; cursor:pointer; font-size:13px; font-weight:500;
      border-left:2px solid transparent; transition:all .15s; user-select:none;
    }
    .nav-item:hover { color:var(--text); background:var(--surf2); border-left-color:var(--border); }
    .nav-item.active { color:var(--accent); border-left-color:var(--accent); background:rgba(200,151,60,.09); font-weight:600; }
    .nav-combat { color:var(--crit) !important; }
    .nav-combat.active { border-left-color:var(--crit) !important; background:rgba(200,64,64,.08) !important; }
    .nav-icon {
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border-radius:7px; font-size:13px; background:var(--surf2); border:1px solid var(--border);
      flex-shrink:0; transition:all .2s;
    }
    .nav-item:hover .nav-icon { border-color:var(--border2,#4a3828); }
    .nav-item.active .nav-icon { background:rgba(200,151,60,.14); border-color:rgba(200,151,60,.42); box-shadow:0 0 10px rgba(200,151,60,.18); }
    .nav-label { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* ── Sidebar footer ── */
    .sidebar-footer { flex-shrink:0; border-top:1px solid var(--border); padding:8px 12px; background:linear-gradient(180deg,transparent,rgba(0,0,0,0.06) 100%); }
    #music-mini { display:flex; align-items:center; gap:8px; margin-bottom:8px; min-height:24px; background:var(--surf2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; }
    .mini-dot { width:7px; height:7px; border-radius:50%; background:var(--border); flex-shrink:0; transition:background .3s; }
    .mini-dot.playing { background:var(--accent); box-shadow:0 0 7px rgba(200,151,60,0.65); animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.45;transform:scale(1.55)} }
    .mini-label { font-size:11px; color:var(--muted); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .mini-stop { background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px; }
    .mini-stop:hover { color:var(--crit); }
    .btn-new-camp {
      width:100%; background:rgba(200,151,60,0.1); border:1px solid rgba(200,151,60,0.25);
      color:var(--accent); padding:7px 10px; border-radius:6px; cursor:pointer; font-size:11.5px;
      font-weight:600; font-family:inherit; transition:all .15s; text-align:center;
    }
    .btn-new-camp:hover { background:rgba(200,151,60,0.18); border-color:var(--accent); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all .15s; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg,var(--accent),#a07020); color: #0e0c0a; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary { background: var(--surf2); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: #3a0a0a; border: 1px solid #5a1a1a; color: var(--crit); }
    .btn-danger:hover { background: #5a0a0a; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-lg { padding: 13px 28px; font-size: 15px; }
    .btn-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
    .btn-link:hover { text-decoration: underline; }
    .btn-icon { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 12px; }
    .btn-danger-icon { color: var(--muted); }
    .btn-danger-icon:hover { color: var(--crit); }

    /* ── Forms ── */
    .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    .form-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; width: 100%; }
    .form-input:focus { outline: none; border-color: var(--accent); }
    .form-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .form-select:focus { outline: none; border-color: var(--accent); }
    .form-textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%; resize: vertical; min-height: 100px; }
    .form-textarea:focus { outline: none; border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }

    /* ── Views ── */
    .view-header {
      display:flex; align-items:center; justify-content:space-between;
      margin: -28px -28px 24px; padding: 22px 28px 18px;
      border-bottom:1px solid var(--border); flex-wrap:wrap; gap:12px;
      position:relative; overflow:hidden; animation:viewIn .22s ease;
    }
    .view-header::after {
      content:''; position:absolute; right:22px; top:-10px;
      font-size:115px; line-height:1; opacity:0.04; pointer-events:none; user-select:none;
    }
    @keyframes viewIn { from{opacity:.35;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .view-header h1 { font-family:'Cinzel',serif; font-size:21px; font-weight:700; color:var(--accent); margin:0; letter-spacing:.03em; }
    .view-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; }
    .section-hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ── Welcome ── */
    .welcome-wrap { display: flex; align-items: center; justify-content: center; min-height: 70vh; }
    .welcome-box { text-align: center; max-width: 480px; }
    .welcome-icon { font-size: 52px; margin-bottom: 16px; }
    .welcome-title { font-size: 28px; font-weight: 900; color: var(--gold); margin-bottom: 12px; }
    .welcome-sub { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 28px; }

    /* ── Dashboard ── */
    /* ── Dashboard ── */
    .dash-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .dash-campaign-name { font-size: 24px; font-weight: 900; color: var(--text); margin: 0 0 4px; }
    .dash-campaign-meta { font-size: 13px; color: var(--muted); }
    .dash-combat-banner { background: rgba(180,20,20,.12); border: 1px solid rgba(231,76,60,.4); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .dash-combat-title { font-size: 15px; font-weight: 800; color: var(--crit); }
    .dash-combat-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .dash-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 10px; margin-bottom: 16px; }
    .dash-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .dash-stat-num { font-size: 24px; font-weight: 800; color: var(--accent); }
    .dash-stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
    .stat-num { font-size: 24px; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
    .dash-xp-bar-wrap { margin-bottom: 20px; }
    .dash-xp-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .dash-xp-track { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; border: 1px solid var(--border2); }
    .dash-xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 3px; transition: width .5s; }
    .dash-main-grid { display: grid; grid-template-columns: 1fr 280px; gap: 16px; align-items: start; }
    @media (max-width: 860px) { .dash-main-grid { grid-template-columns: 1fr; } }
    .dash-col-main, .dash-col-side { display: flex; flex-direction: column; gap: 14px; }
    .dash-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--text); }
    .dash-btn { display: block; width: 100%; margin-bottom: 8px; text-align: left; }
    .dash-quest-row { padding: 9px 12px; background: var(--bg); border: 1px solid var(--border2); border-radius: 7px; margin-bottom: 7px; cursor: pointer; }
    .dash-quest-row:hover { border-color: var(--border); }
    .dash-quest-row > div:first-child { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .dash-quest-title { font-weight: 700; font-size: 13px; color: var(--text); }
    .dash-quest-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .dash-quest-act { font-size: 11px; color: var(--accent); margin-top: 3px; font-style: italic; }
    .dash-npc-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border2); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
    .dash-npc-row:hover { border-color: var(--border); }
    .dash-npc-name { font-weight: 700; font-size: 13px; color: var(--text); }
    .dash-npc-meta { font-size: 11px; color: var(--muted); }
    .dash-npc-faction { font-size: 10px; color: var(--accent); text-align: right; }
    .dash-hist-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border2); }
    .dash-hist-row:last-child { border-bottom: none; }
    .dash-hist-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .dash-hist-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .dash-hist-date { font-size: 11px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    .dash-quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .dash-quick-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 600; padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; transition: all .12s; }
    .dash-quick-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface); }
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .dash-grid { grid-template-columns: 1fr; } }

    /* ── List rows ── */
    .list-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border2); border-radius: 6px; margin-bottom: 6px; cursor: pointer; gap: 12px; }
    .list-row:hover { border-color: var(--border); }
    .list-name { font-weight: 600; color: var(--text); font-size: 13px; }
    .list-meta { font-size: 11px; color: var(--muted); }
    .empty-msg { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0; }

    /* ── Tags ── */
    .tag-ok   { background: #0a1a0a; color: var(--ok);   border: 1px solid #1a3a1a; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .tag-warn { background: #1a1200; color: var(--warn);  border: 1px solid #3a2a00; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .tag-crit { background: #1a0000; color: var(--crit);  border: 1px solid #3a1010; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .tag-muted{ background: var(--surf2); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }

    /* ── Gen controls ── */
    .gen-controls { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .gen-field { display: flex; flex-direction: column; }

    /* ── Map ── */
    .map-controls { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .map-wrap { background: #050403; border: 1px solid var(--border); border-radius: 10px; overflow: auto; padding: 12px; }
    .map-placeholder { color: var(--muted); font-size: 13px; font-style: italic; padding: 40px; text-align: center; }
    .map-title { color: var(--accent); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .map-legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .token-toolbar { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 4px; }
    .token-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .token-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; min-width: 42px; }
    .token-hint { font-size: 11px; color: var(--accent); margin-top: 2px; }
    .token-btn { padding: 4px 11px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 12px; transition: border-color .15s, background .15s; }
    .token-btn:hover { border-color: var(--accent); }
    .token-btn[data-type="player"] { border-color: #c8a018; color: #c8a018; }
    .token-btn[data-type="enemy"]  { border-color: #c42020; color: #c42020; }
    .token-btn[data-type="npc"]    { border-color: #2060c8; color: #2060c8; }
    .token-btn[data-type="reveal"] { border-color: #b08000; color: #d0a820; }
    .token-btn[data-type="hide"]   { border-color: #5058a8; color: #8088d8; }
    .token-btn.active { background: rgba(255,255,255,0.08); filter: brightness(1.28); }
    .token-btn-clear { color: var(--muted) !important; border-color: var(--border) !important; }

    /* ── Avatar picker ── */
    .avatar-strip { display: flex; flex-wrap: wrap; gap: 3px; }
    .avatar-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; font-size: 15px; padding: 1px 4px; cursor: pointer; line-height: 1.5; transition: border-color .12s, background .12s; }
    .avatar-btn:hover { border-color: var(--accent); background: var(--surf2); }
    .avatar-btn.active { border-color: var(--accent); background: rgba(200,151,60,.18); box-shadow: 0 0 6px rgba(200,151,60,.3); }
    .fog-brush-btn.active { background: var(--accent) !important; color: #0e0c09 !important; border-color: var(--accent) !important; }
    .map-ctx-menu { position: absolute; z-index: 200; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px; min-width: 148px; box-shadow: 0 4px 18px rgba(0,0,0,.7); }
    .map-ctx-menu.hidden { display: none; }
    .map-ctx-title { font-size: 11px; font-weight: 700; color: var(--muted); padding: 3px 8px 6px; border-bottom: 1px solid var(--border2); margin-bottom: 4px; }
    .map-ctx-item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); font-size: 13px; padding: 6px 10px; border-radius: 5px; cursor: pointer; transition: all .1s; }
    .map-ctx-item:hover { background: var(--surf2); color: var(--accent); }
    .map-ctx-danger:hover { color: var(--crit) !important; }

    /* ── Map HUD ── */
    .map-hud { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; margin: 6px 0; }
    .hud-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .hud-section { display: flex; align-items: center; gap: 5px; }
    .hud-flex { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .hud-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
    .hud-num { font-size: 20px; font-weight: 800; color: var(--gold); min-width: 26px; text-align: center; line-height: 1; }
    .hud-btn { background: var(--surf2); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 5px; cursor: pointer; }
    .hud-btn:hover { border-color: var(--accent); color: var(--accent); }
    .hud-del:hover { border-color: var(--crit) !important; color: var(--crit) !important; }
    .hud-add { background: none; border: 1px dashed var(--border); color: var(--muted); font-size: 11px; padding: 2px 9px; border-radius: 5px; cursor: pointer; }
    .hud-add:hover { border-color: var(--accent); color: var(--accent); }
    .hud-divider { width: 1px; height: 22px; background: var(--border); }
    .hud-timer { display: flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
    .hud-timer.hud-warn   { border-color: var(--warn); }
    .hud-timer.hud-urgent { border-color: var(--crit); animation: pulse .8s ease-in-out infinite; }
    .hud-timer-name, .hud-counter-name { font-size: 10px; color: var(--muted); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hud-timer-time { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; min-width: 36px; text-align: center; }
    .hud-timer-bar-wrap { width: 44px; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; border: 1px solid var(--border2); }
    .hud-timer-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1s linear; }
    .hud-counter { display: flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }

    /* ── Music ── */
    .music-now { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; min-height: 40px; }
    .now-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .now-dot.playing { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
    .mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 12px; margin-bottom: 20px; }
    .mood-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px 14px 16px; cursor: pointer; transition: all .16s; text-align: center; user-select: none; position: relative; }
    .mood-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
    .mood-card.active  { border-color: var(--gold); background: #1a1200; box-shadow: 0 0 24px rgba(240,192,64,.15); }
    .mood-card.theme-warm.active    { border-color: #f0a030; background: #1a1200; box-shadow: 0 0 24px rgba(240,160,48,.22); }
    .mood-card.theme-red.active     { border-color: #c84040; background: #1a0a0a; box-shadow: 0 0 26px rgba(200,64,64,.25); }
    .mood-card.theme-crimson.active { border-color: #a01818; background: #160606; box-shadow: 0 0 28px rgba(160,24,24,.28); }
    .mood-card.theme-green.active   { border-color: #3a8a3a; background: #0a150a; box-shadow: 0 0 24px rgba(58,138,58,.22); }
    .mood-card.theme-purple.active  { border-color: var(--purp2); background: #130a1e; box-shadow: 0 0 26px rgba(176,108,204,.28); }
    .mood-card.theme-void.active    { border-color: #6060a0; background: #080810; box-shadow: 0 0 28px rgba(96,96,160,.22); }
    .mood-card.theme-gold.active    { border-color: var(--gold); background: #1a1400; box-shadow: 0 0 32px rgba(240,192,64,.30); }
    .mood-card.loading { border-color: var(--accent); opacity: .75; pointer-events: none; }
    .mood-bpm { position: absolute; top: 8px; right: 8px; font-size: 10px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; }
    .mood-icon { font-size: 28px; margin-bottom: 7px; }
    .mood-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .mood-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .mood-inst { font-size: 10px; color: var(--border); margin-top: 5px; letter-spacing: 0.04em; }
    .music-vol-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .music-vol-row label { color: var(--muted); font-size: 12px; }
    input[type=range] { accent-color: var(--accent); cursor: pointer; width: 100px; }
    .vol-label { font-size: 12px; color: var(--muted); min-width: 45px; }

    /* ── Stat block ── */
    .stat-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .sb-name { font-size: 18px; font-weight: 800; color: var(--text); }
    .sb-sub { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .sb-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .sb-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; margin-bottom: 4px; }
    .sb-key { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
    .sb-stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .sb-stat { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; text-align: center; min-width: 52px; }
    .sb-sval { font-size: 18px; font-weight: 800; color: var(--text); }
    .sb-smod { font-size: 13px; color: var(--accent); }
    .sb-skey { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

    /* ── Info cards ── */
    .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .ic-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .ic-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 13px; flex-wrap: wrap; }
    .ic-key { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; flex-shrink: 0; }

    /* ── Quests ── */
    .quest-row { cursor: default; }
    .quest-row:hover { border-color: var(--border); }

    /* ── Combat tracker ── */
    .combat-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .combat-header h1 { font-size: 20px; font-weight: 800; margin: 0; }
    .combat-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .combat-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .active-banner { background: #201800; border: 1px solid var(--accent); border-radius: 6px; padding: 7px 14px; font-size: 13px; color: var(--gold); margin-bottom: 14px; }

    .combatant-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; margin-bottom: 8px; transition: all .15s; }
    .combatant-active { background: #1c1400; border-color: var(--accent) !important; box-shadow: 0 0 18px rgba(200,151,60,.12); }
    .combatant-dead { opacity: .45; }

    .cr-init { text-align: center; min-width: 38px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
    .cr-init:hover { background: var(--surf2); }
    .cr-init-num { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1; }
    .cr-init-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    .cr-body { flex: 1; min-width: 0; }
    .cr-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
    .cr-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .cr-player { color: var(--accent); }
    .cr-player-label { background: #1a1200; color: var(--accent); border: 1px solid var(--border); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
    .cr-meta { font-size: 11px; color: var(--muted); }
    .cr-active-badge { background: #2a1a00; color: var(--gold); border: 1px solid #4a3000; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .cr-dead-badge { background: #1a0000; color: var(--crit); border: 1px solid #3a1010; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }

    .cr-mid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .cr-hp-area { display: flex; flex-direction: column; gap: 3px; }
    .cr-hp-text { font-size: 13px; font-weight: 600; color: var(--text); }
    .cr-hp-crit { color: var(--crit); }
    .cr-hp-low  { color: var(--warn); }
    .cr-hp-bar-wrap { width: 140px; height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
    .cr-hp-bar { height: 100%; border-radius: 3px; transition: width .3s; }
    .hp-ok   { background: linear-gradient(90deg, var(--ok), #2a7a3a); }
    .hp-low  { background: linear-gradient(90deg, var(--warn), #a07010); }
    .hp-crit { background: linear-gradient(90deg, var(--crit), #8a1010); }
    .cr-ac { font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }

    .cr-conds { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .cond-tag { background: #2a1a0a; border: 1px solid var(--border); color: var(--warn); font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; }
    .cond-tag:hover { color: var(--crit); border-color: var(--crit); }
    .cond-add { background: none; border: 1px dashed var(--border); color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; }
    .cond-add:hover { border-color: var(--accent); color: var(--accent); }
    .cr-note { font-size: 11px; color: var(--muted); font-style: italic; }

    .cr-btns { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .cr-btn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 5px; cursor: pointer; transition: all .12s; white-space: nowrap; }
    .cr-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cr-btn-heal:hover { border-color: var(--ok); color: var(--ok); }
    .cr-btn-dmg:hover  { border-color: var(--crit); color: var(--crit); }
    .cr-btn-del:hover  { border-color: var(--crit); color: var(--crit); }

    .cond-picker { display: flex; flex-direction: column; gap: 5px; max-height: 60vh; overflow-y: auto; }
    .cond-pick-item { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; cursor: pointer; transition: all .12s; }
    .cond-pick-item:hover { border-color: var(--accent); }
    .cond-pick-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .cond-pick-desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

    /* ── Combat Tracker additions ── */
    .combat-main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .combat-main-grid { grid-template-columns: 1fr; } }
    .combat-side-panel { display: flex; flex-direction: column; gap: 12px; }
    .combat-log { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .combat-log-header { background: var(--card2); border-bottom: 1px solid var(--border); padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); }
    .combat-log-body { max-height: 260px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .log-entry { font-size: 11px; color: var(--muted); line-height: 1.5; padding: 3px 6px; border-radius: 4px; }
    .log-entry:hover { background: var(--surface); }
    .log-round { display: inline-block; background: var(--card2); border: 1px solid var(--border2); border-radius: 3px; font-size: 9px; font-weight: 700; color: var(--accent); padding: 0 4px; margin-right: 5px; vertical-align: middle; }
    .cr-conc-badge { background: rgba(120,80,200,.15); border: 1px solid rgba(150,100,255,.3); color: #b09aff; font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
    .cr-conc-badge:hover { border-color: rgba(150,100,255,.6); }
    .cr-deathsaves { display: flex; align-items: center; gap: 8px; margin-top: 5px; background: rgba(231,76,60,.06); border: 1px solid rgba(231,76,60,.2); border-radius: 6px; padding: 5px 10px; }
    .cr-death-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--crit); white-space: nowrap; }
    .cr-death-group { display: flex; gap: 4px; }
    .cr-ds { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); font-size: 11px; font-weight: 700; cursor: pointer; transition: all .12s; }
    .cr-ds-success { border-color: var(--ok); color: var(--ok); }
    .cr-ds-success.cr-ds-filled { background: var(--ok); color: #000; }
    .cr-ds-fail { border-color: var(--crit); color: var(--crit); }
    .cr-ds-fail.cr-ds-filled { background: var(--crit); color: #fff; }
    .cr-ds:hover { transform: scale(1.15); }
    .combat-env-panel, .combat-tactics-panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .combat-side-title { background: var(--card2); border-bottom: 1px solid var(--border); padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); }
    .combat-env-features { padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }
    .combat-env-feature { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .combat-env-feature strong { color: var(--text); }
    .combat-tactic-item { padding: 6px 12px; border-bottom: 1px solid var(--border2); font-size: 11px; color: var(--muted); line-height: 1.5; }
    .combat-tactic-item:last-child { border-bottom: none; }
    .combat-tactic-label { display: block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); margin-bottom: 2px; }

    /* ── Lore ── */
    .lore-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .lore-tab { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .lore-tab:hover { color: var(--text); border-color: var(--accent); }
    .lore-tab.active { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .lore-section-title { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 10px; }
    .deity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 8px; }
    .deity-card { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; }
    .deity-name { font-weight: 700; color: var(--text); font-size: 13px; }
    .deity-domain { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .deity-align { font-size: 11px; color: var(--accent); margin-top: 2px; }
    .lore-list { list-style: none; }
    .lore-list li { padding: 5px 0; border-bottom: 1px solid var(--border2); font-size: 13px; color: var(--muted); }
    .lore-list li:last-child { border-bottom: none; }
    .plot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
    .plot-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .plot-num { color: var(--accent); font-weight: 800; font-size: 16px; margin-bottom: 6px; }
    .plot-card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .name-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .name-item { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 6px 12px; border-radius: 6px; }

    /* ── NPC Cards ── */
    .npc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .npc-card-compact { margin: 0 0 4px; border-radius: 0 0 10px 10px; border-top: none; }
    .npc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; background: rgba(255,255,255,.03); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .npc-name { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 3px; }
    .npc-sub { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .npc-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .npc-combat-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
    .npc-combat-stat { flex: 1; text-align: center; padding: 8px 4px; border-right: 1px solid var(--border2); }
    .npc-combat-stat:last-child { border-right: none; }
    .npc-combat-val { font-size: 16px; font-weight: 800; color: var(--text); }
    .npc-combat-key { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .npc-stat-row { display: flex; border-bottom: 1px solid var(--border); }
    .npc-stat-cell { flex: 1; text-align: center; padding: 8px 4px; border-right: 1px solid var(--border2); }
    .npc-stat-cell:last-child { border-right: none; }
    .npc-stat-val { font-size: 14px; font-weight: 700; color: var(--text); }
    .npc-stat-mod { font-size: 13px; color: var(--accent); font-weight: 600; }
    .npc-stat-key { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
    .npc-stat-save { font-size: 10px; color: var(--muted); }
    .npc-skills-row { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 14px; border-bottom: 1px solid var(--border); align-items: center; }
    .npc-skills-label { font-size: 10px; text-transform: uppercase; color: var(--muted); margin-right: 4px; letter-spacing: .04em; }
    .npc-skill-tag { background: rgba(138,180,248,.1); border: 1px solid rgba(138,180,248,.2); color: var(--accent); font-size: 10px; padding: 1px 6px; border-radius: 3px; }
    .npc-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
    .npc-section { }
    .npc-section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
    .npc-text { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
    .npc-trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .npc-trait { background: rgba(255,255,255,.025); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 11px; }
    .npc-trait-flaw { border-color: rgba(231,76,60,.25); background: rgba(231,76,60,.04); }
    .npc-trait-key { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
    .npc-trait-val { font-size: 12px; color: var(--text); line-height: 1.5; }
    .npc-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .npc-two-col { grid-template-columns: 1fr; } .npc-trait-grid { grid-template-columns: 1fr; } }
    .npc-secret-block { background: rgba(231,76,60,.04); border: 1px solid rgba(231,76,60,.18); border-radius: 8px; padding: 10px 12px; }
    .npc-equip-list { margin: 8px 0 0; padding-left: 16px; display: flex; flex-direction: column; gap: 3px; }
    .npc-equip-list li { font-size: 12px; color: var(--muted); }
    .npc-dm-note { background: rgba(231,76,60,.04); border: 1px solid rgba(231,76,60,.18); border-radius: 8px; padding: 10px 12px; }

    /* ── Quest Cards ── */
    .quest-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .quest-card-compact { margin: 0 0 4px; border-radius: 0 0 10px 10px; border-top: none; }
    .quest-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; background: rgba(255,255,255,.03); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .quest-header > div:first-child { display: flex; gap: 14px; align-items: flex-start; flex: 1; min-width: 0; }
    .quest-icon { font-size: 28px; line-height: 1; flex-shrink: 0; margin-top: 2px; }
    .quest-title { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
    .quest-meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .quest-chip { background: rgba(138,180,248,.1); border: 1px solid rgba(138,180,248,.2); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 4px; }
    .quest-urgency { font-size: 11px; color: var(--muted); font-style: italic; }
    .quest-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
    .quest-section { }
    .quest-section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .quest-dm-tag { background: rgba(231,76,60,.18); color: #e74c3c; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; letter-spacing: .04em; }
    .quest-text { font-size: 13px; color: var(--muted); line-height: 1.65; margin: 0; }
    .quest-npc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 10px; }
    .quest-npc-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .quest-npc-villain { border-color: rgba(231,76,60,.35); background: rgba(231,76,60,.05); }
    .quest-npc-ally { border-color: rgba(46,204,113,.3); background: rgba(46,204,113,.04); }
    .quest-npc-role { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
    .quest-npc-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
    .quest-npc-title { font-size: 11px; color: var(--accent); margin-bottom: 6px; }
    .quest-npc-desc { font-size: 12px; color: var(--muted); margin: 0 0 6px; line-height: 1.5; }
    .quest-npc-secret { font-size: 11px; color: var(--muted); border-top: 1px solid var(--border2); padding-top: 6px; margin-top: 2px; line-height: 1.4; }
    .quest-acts { display: flex; flex-direction: column; gap: 10px; }
    .quest-act { background: rgba(255,255,255,.025); border: 1px solid var(--border2); border-radius: 8px; padding: 12px 14px; }
    .quest-act-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .quest-act-num { background: var(--accent); color: #000; font-size: 10px; font-weight: 900; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .quest-act-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .quest-act-loc { font-size: 11px; color: var(--muted); }
    .quest-encounter-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; background: rgba(0,0,0,.15); border-radius: 5px; padding: 6px 8px; }
    .enc-tag { background: rgba(255,255,255,.06); border: 1px solid var(--border2); font-size: 11px; color: var(--text); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .quest-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .quest-two-col { grid-template-columns: 1fr; } }
    .quest-list { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 6px; }
    .quest-list li { font-size: 12px; color: var(--muted); line-height: 1.55; }
    .quest-resolutions { display: flex; flex-direction: column; gap: 8px; }
    .quest-resolution { background: rgba(255,255,255,.025); border: 1px solid var(--border2); border-radius: 7px; padding: 10px 12px; }
    .quest-resolution-name { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .quest-rewards { background: rgba(138,180,248,.06); border: 1px solid rgba(138,180,248,.2); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .quest-reward-row { display: flex; gap: 10px; font-size: 12px; }
    .quest-reward-key { color: var(--accent); font-weight: 700; min-width: 60px; flex-shrink: 0; }
    .quest-reward-row span:last-child { color: var(--muted); line-height: 1.5; }
    .quest-dm-notes { background: rgba(231,76,60,.05); border: 1px solid rgba(231,76,60,.2); border-radius: 8px; padding: 12px 14px; }
    .quest-row { cursor: pointer; }
    .quest-row:hover { background: rgba(255,255,255,.04); }

    /* ── Spells ── */
    .spell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; margin-bottom: 8px; }
    .spell-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: border-color .2s; }
    .spell-card:hover { border-color: var(--accent); }
    .spell-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .spell-name { font-weight: 700; font-size: 14px; color: var(--text); }
    .spell-school { font-size: 11px; font-weight: 600; text-transform: capitalize; }
    .spell-meta { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .spell-classes { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .spell-class-tag { background: rgba(138,180,248,.12); border: 1px solid rgba(138,180,248,.25); color: var(--accent); font-size: 10px; padding: 1px 6px; border-radius: 3px; }
    .spell-desc { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .spell-card.expanded .spell-desc { display: block; -webkit-line-clamp: unset; }
    .spell-components { font-style: italic; }

    /* ── Rules Reference ── */
    .rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; }
    .rule-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .rule-name { font-weight: 700; font-size: 14px; color: var(--accent); margin-bottom: 6px; }
    .rule-desc { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 0; }
    .rules-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rules-table th { text-align: left; color: var(--muted); border-bottom: 1px solid var(--border); padding: 6px 8px; font-weight: 600; }
    .rules-table td { padding: 7px 8px; border-bottom: 1px solid var(--border2); color: var(--text); }
    .rules-table tr:last-child td { border-bottom: none; }

    /* ── Encounter Card ── */
    .enc-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 16px; }
    .enc-header { background: var(--card2); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; }
    .enc-env-block { margin-left: auto; text-align: right; }
    .enc-env-name { font-size: 14px; font-weight: 700; color: var(--accent); }
    .enc-env-desc { color: var(--muted); font-size: 11px; max-width: 320px; line-height: 1.5; margin-top: 3px; }
    .enc-xp-row { color: var(--muted); font-size: 12px; margin-top: 5px; }
    .enc-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .enc-section { display: flex; flex-direction: column; gap: 8px; }
    .enc-section-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--border2); padding-bottom: 5px; display: flex; align-items: center; gap: 6px; }
    .enc-features { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
    .enc-feature { background: var(--card2); border: 1px solid var(--border2); border-radius: 6px; padding: 9px 12px; font-size: 12px; }
    .enc-feature-name { font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .enc-feature-rule { color: var(--muted); line-height: 1.5; }
    .enc-monsters { display: flex; flex-direction: column; gap: 10px; }
    .enc-monster { background: var(--card2); border: 1px solid var(--border2); border-radius: 8px; padding: 12px 14px; }
    .enc-monster-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .enc-monster-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .enc-monster-cr { font-size: 11px; font-weight: 700; color: var(--gold); background: rgba(255,165,0,.12); border: 1px solid rgba(255,165,0,.25); padding: 1px 7px; border-radius: 4px; }
    .enc-monster-type { font-size: 11px; color: var(--muted); text-transform: capitalize; }
    .enc-monster-count { font-size: 13px; color: var(--accent); font-weight: 700; margin-left: auto; }
    .enc-stat-bar { display: flex; flex-wrap: wrap; gap: 14px; }
    .enc-stat-item { display: flex; flex-direction: column; align-items: center; min-width: 42px; }
    .enc-stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .enc-stat-val { font-size: 13px; font-weight: 700; color: var(--text); }
    .enc-monster-traits { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.6; border-top: 1px solid var(--border2); padding-top: 7px; }
    .enc-tactic-grid { display: flex; flex-direction: column; gap: 8px; }
    .enc-tactic { background: var(--card2); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 9px 12px; font-size: 12px; color: var(--text); line-height: 1.6; }
    .enc-tactic-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--accent); margin-bottom: 4px; }
    .enc-skill-opps { display: flex; flex-direction: column; gap: 7px; }
    .enc-skill-opp { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; }
    .enc-skill-badge { background: rgba(120,80,200,.18); border: 1px solid rgba(150,100,255,.3); border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 600; color: #b09aff; white-space: nowrap; flex-shrink: 0; }
    .enc-skill-effect { color: var(--muted); line-height: 1.5; }
    .enc-escalation { background: rgba(231,76,60,.06); border: 1px solid rgba(231,76,60,.2); border-radius: 6px; padding: 10px 14px; font-size: 12px; color: var(--text); line-height: 1.6; }
    .enc-loot { display: flex; flex-direction: column; gap: 6px; }
    .enc-loot-item { font-size: 12px; color: var(--muted); line-height: 1.5; padding-left: 18px; position: relative; }
    .enc-loot-item::before { content: '◆'; position: absolute; left: 0; color: var(--gold); font-size: 10px; top: 2px; }
    .enc-dm-note { background: rgba(255,165,0,.06); border: 1px solid rgba(255,165,0,.2); border-radius: 6px; padding: 12px 14px; font-size: 12px; color: var(--text); line-height: 1.7; }
    .enc-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 20px; }

    /* ── Modal ── */
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    #modal-overlay.hidden { display: none; }
    #modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    #modal-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 16px; }
    #modal-body { margin-bottom: 16px; }
    #modal-body label { display: block; margin-top: 12px; }
    #modal-body label:first-child { margin-top: 0; }
    #modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* ── Toast ── */
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--accent); color: var(--accent); padding: 8px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 2000; }
    #toast.show { opacity: 1; }

    /* ── Responsive sidebar ── */
    @media (max-width: 600px) {
      #sidebar { width: 160px; }
      .nav-item { font-size: 12px; padding: 8px 12px; }
    }
    @media (max-width: 480px) {
      #sidebar { display: none; }
      #content { padding: 16px; }
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ═══════════════════════════════════════════════════════════════
       ATMOSPHERE — per-view art, header banners, sidebar texture
       ═══════════════════════════════════════════════════════════════ */

    /* Main overflow fix for view-header bleed */
    #main { overflow-x: hidden; }

    /* Per-view atmospheric backgrounds */
    #content[data-view="dashboard"] {
      background-image:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(200,151,60,0.14) 0%, transparent 55%),
        repeating-linear-gradient(45deg,  transparent 0, transparent 28px, rgba(200,151,60,0.02) 28px, rgba(200,151,60,0.02) 29px),
        repeating-linear-gradient(-45deg, transparent 0, transparent 28px, rgba(200,151,60,0.02) 28px, rgba(200,151,60,0.02) 29px);
    }
    #content[data-view="maps"] {
      background-image:
        radial-gradient(ellipse 60% 50% at 88% 14%, rgba(70,120,170,0.11) 0%, transparent 55%),
        repeating-linear-gradient(0deg,  transparent 0, transparent 39px, rgba(80,130,190,0.06) 39px, rgba(80,130,190,0.06) 40px),
        repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(80,130,190,0.06) 39px, rgba(80,130,190,0.06) 40px);
    }
    #content[data-view="npcs"] {
      background-image:
        radial-gradient(ellipse 35% 90% at -5% 50%, rgba(60,100,160,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 20% 30% at 106% 85%, rgba(100,50,150,0.07) 0%, transparent 50%),
        repeating-linear-gradient(0deg, transparent 0, transparent 14px, rgba(255,255,255,0.012) 14px, rgba(255,255,255,0.012) 15px);
    }
    #content[data-view="quests"] {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(180,140,55,0.13) 0%, transparent 52%),
        repeating-linear-gradient(0deg, transparent 0, transparent 27px, rgba(180,140,55,0.03) 27px, rgba(180,140,55,0.03) 28px);
    }
    #content[data-view="encounters"] {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 112%, rgba(200,35,35,0.24) 0%, transparent 55%),
        radial-gradient(ellipse 30% 25% at 4% 4%, rgba(100,20,20,0.10) 0%, transparent 50%),
        repeating-linear-gradient(0deg,  transparent 0, transparent 18px, rgba(200,50,30,0.022) 18px, rgba(200,50,30,0.022) 19px),
        repeating-linear-gradient(90deg, transparent 0, transparent 18px, rgba(200,50,30,0.022) 18px, rgba(200,50,30,0.022) 19px);
    }
    #content[data-view="lore"] {
      background-image:
        radial-gradient(ellipse 55% 90% at 109% 50%, rgba(160,95,35,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 35% 40% at -8% 4%, rgba(120,70,20,0.09) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent 0, transparent 19px, rgba(160,100,40,0.025) 19px, rgba(160,100,40,0.025) 20px);
    }
    #content[data-view="music"] {
      background-image:
        radial-gradient(ellipse 70% 65% at 50% 35%, rgba(139,76,158,0.22) 0%, rgba(70,40,130,0.10) 45%, transparent 65%),
        radial-gradient(ellipse 35% 30% at 12% 90%, rgba(60,80,200,0.10) 0%, transparent 55%),
        radial-gradient(ellipse 25% 20% at 90% 8%,  rgba(180,60,220,0.09) 0%, transparent 50%);
    }
    #content[data-view="combat"] {
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 112%, rgba(200,35,35,0.24) 0%, transparent 55%),
        radial-gradient(ellipse 30% 25% at 4% 4%, rgba(100,20,20,0.10) 0%, transparent 50%);
    }
    #content[data-view="spells"] {
      background-image:
        radial-gradient(ellipse 60% 60% at 50% 30%, rgba(100,60,200,0.15) 0%, rgba(60,40,130,0.08) 50%, transparent 65%);
    }
    #content[data-view="rules"] {
      background-image:
        radial-gradient(ellipse 80% 45% at 50% -10%, rgba(180,140,55,0.10) 0%, transparent 50%);
    }

    /* Per-view header banner accents */
    #content[data-view="dashboard"]  .view-header { border-top: 3px solid var(--accent);  background: linear-gradient(90deg, rgba(200,151,60,0.10) 0%, transparent 65%); }
    #content[data-view="maps"]       .view-header { border-top: 3px solid #4a88c0;         background: linear-gradient(90deg, rgba(74,136,192,0.10) 0%, transparent 65%); }
    #content[data-view="npcs"]       .view-header { border-top: 3px solid #5a7ab8;         background: linear-gradient(90deg, rgba(90,122,184,0.09) 0%, transparent 65%); }
    #content[data-view="quests"]     .view-header { border-top: 3px solid #c8a03c;         background: linear-gradient(90deg, rgba(180,140,55,0.10) 0%, transparent 65%); }
    #content[data-view="encounters"] .view-header { border-top: 3px solid var(--crit);     background: linear-gradient(90deg, rgba(200,40,40,0.12) 0%, transparent 65%); }
    #content[data-view="combat"]     .view-header { border-top: 3px solid var(--crit);     background: linear-gradient(90deg, rgba(200,40,40,0.12) 0%, transparent 65%); }
    #content[data-view="lore"]       .view-header { border-top: 3px solid #c09040;         background: linear-gradient(90deg, rgba(160,100,40,0.11) 0%, transparent 65%); }
    #content[data-view="music"]      .view-header { border-top: 3px solid var(--purple);   background: linear-gradient(90deg, rgba(139,76,158,0.14) 0%, transparent 65%); }
    #content[data-view="spells"]     .view-header { border-top: 3px solid #7060c8;         background: linear-gradient(90deg, rgba(100,60,200,0.12) 0%, transparent 65%); }
    #content[data-view="rules"]      .view-header { border-top: 3px solid #c8a03c;         background: linear-gradient(90deg, rgba(180,140,55,0.08) 0%, transparent 65%); }

    /* ── v2 Design Components ─────────────────────────────────────────── */

    /* Shared */
    .chip { background:var(--surf2); border:1px solid var(--border); color:var(--muted); font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; white-space:nowrap; display:inline-block; }
    .subtitle { color:var(--muted); font-size:13px; margin-top:2px; }
    .view-actions { display:flex; gap:8px; align-items:center; }
    .empty-state { text-align:center; padding:48px 24px; color:var(--muted); }
    .empty-state-icon { font-size:42px; margin-bottom:12px; }
    .empty-state-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px; }
    .empty-state-sub { font-size:13px; line-height:1.6; }

    /* Gen panel */
    .gen-panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:20px; display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
    .gen-panel-fields { display:flex; gap:12px; flex-wrap:wrap; flex:1; }
    .gen-panel-btn { flex-shrink:0; align-self:flex-end; }
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }

    /* Filter pills */
    .filter-pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
    .filter-pill { background:none; border:1px solid var(--border); color:var(--muted); padding:6px 14px; border-radius:20px; cursor:pointer; font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:5px; transition:all .15s; }
    .filter-pill:hover { border-color:var(--accent); color:var(--text); }
    .filter-pill.active { background:rgba(200,151,60,.12); border-color:var(--accent); color:var(--accent); }
    .filter-pill-icon { font-size:13px; }

    /* View toggle */
    .view-toggle { display:flex; background:var(--surf2); border:1px solid var(--border); border-radius:7px; overflow:hidden; }
    .view-toggle-btn { background:none; border:none; color:var(--muted); padding:6px 12px; cursor:pointer; font-size:13px; transition:all .15s; }
    .view-toggle-btn.active { background:var(--surface); color:var(--accent); }

    /* Quest item rows (new live-app style) */
    .quest-list-stack { display:flex; flex-direction:column; gap:8px; }
    .quest-item { display:flex; align-items:stretch; background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden; cursor:pointer; transition:all .15s; }
    .quest-item:hover { border-color:var(--accent); transform:translateX(2px); }
    .quest-item-bar { width:4px; flex-shrink:0; }
    .quest-item-body { flex:1; padding:12px 14px; min-width:0; }
    .quest-item-header { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
    .quest-item-title { font-family:'Cinzel',serif; font-size:14px; font-weight:700; color:var(--text); }
    .quest-item-badges { display:flex; gap:6px; flex-shrink:0; }
    .quest-item-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
    .quest-item-desc { font-size:12px; color:var(--muted); line-height:1.5; margin:0 0 6px; }
    .quest-item-reward { font-size:12px; color:var(--accent); }
    .quest-item-arrow { display:flex; align-items:center; padding:0 12px; color:var(--border); font-size:16px; }
    .badge { padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700; }
    .badge-Active  { background:#1a1200; color:var(--accent);  border:1px solid rgba(200,151,60,.3); }
    .badge-Complete,.badge-Completed,.badge-completed { background:#0a1a0a; color:var(--ok);    border:1px solid rgba(63,185,80,.3); }
    .badge-Failed,.badge-failed   { background:#1a0000; color:var(--crit); border:1px solid rgba(200,64,64,.3); }
    .badge-Abandoned,.badge-abandoned { background:var(--surf2); color:var(--muted); border:1px solid var(--border); }
    .badge-Easy,.badge-easy   { background:#0a1a0a; color:var(--ok);   border:1px solid rgba(63,185,80,.3); }
    .badge-Medium,.badge-medium { background:#1a1200; color:var(--warn); border:1px solid rgba(210,153,34,.3); }
    .badge-Hard,.badge-hard   { background:#1a0e00; color:#e07030;    border:1px solid rgba(224,112,48,.3); }
    .badge-Deadly,.badge-deadly { background:#1a0000; color:var(--crit); border:1px solid rgba(200,64,64,.3); }

    /* NPC card2 (compact list style) */
    .npc-card2 { display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px; cursor:pointer; transition:all .15s; }
    .npc-card2:hover { border-color:var(--accent); }
    .npc-card2-avatar { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,rgba(200,151,60,.28),rgba(200,151,60,.08)); border:1px solid rgba(200,151,60,.35); display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:15px; font-weight:700; color:var(--accent); flex-shrink:0; }
    .npc-card2-header { flex:1; min-width:0; }
    .npc-card2-name { font-family:'Cinzel',serif; font-size:14px; font-weight:600; color:var(--text); margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .npc-card2-sub { font-size:12px; color:var(--muted); margin-bottom:5px; }
    .npc-card2-chips { display:flex; gap:5px; flex-wrap:wrap; }
    .npc-card2-actions { display:flex; gap:6px; flex-shrink:0; }

    /* Lore grid cards */
    .lore-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-bottom:20px; }
    .lore-card { background:var(--surface); border:1px solid var(--border); border-top-width:3px; border-radius:8px; padding:14px; cursor:pointer; transition:all .15s; }
    .lore-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 16px rgba(0,0,0,.35); }
    .lore-card-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .lore-card-cat-icon { font-size:14px; flex-shrink:0; }
    .lore-card-title { font-family:'Cinzel',serif; font-size:14px; font-weight:600; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lore-cat-chip { font-size:10px; }
    .lore-card-body { font-size:12px; color:var(--muted); line-height:1.6; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:8px; }
    .lore-card-tags { display:flex; flex-wrap:wrap; gap:4px; }

    /* Wildemount ref redesign */
    .wm-section-title { font-family:'Cinzel',serif; font-size:14px; font-weight:700; color:var(--accent); margin:20px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
    .wm-card { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:8px; }
    .wm-card-header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
    .wm-card-name { font-size:14px; font-weight:700; color:var(--text); }
    .wm-card-desc { font-size:12px; color:var(--muted); line-height:1.6; margin:0 0 6px; }
    .wm-chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
    .wm-details summary { font-size:12px; color:var(--accent); cursor:pointer; }
    .wm-hooks { margin:6px 0 0 16px; display:flex; flex-direction:column; gap:4px; }
    .wm-hooks li { font-size:12px; color:var(--muted); line-height:1.5; }
    .wm-deity-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-bottom:8px; }
    .wm-deity-card { background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:10px 12px; }
    .wm-deity-name { font-size:13px; font-weight:700; color:var(--text); margin-bottom:4px; }
    .wm-subclass { background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:10px 12px; margin-bottom:6px; }
    .wm-subclass-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .wm-subclass-name { font-size:13px; font-weight:700; color:var(--text); }
    .wm-seeds { display:flex; flex-direction:column; gap:8px; }
    .wm-seed { background:var(--bg); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; padding:10px 12px; font-size:13px; color:var(--muted); line-height:1.6; }

    /* Music: now-playing banner & updated mood cards */
    .now-playing { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:20px; display:none; align-items:center; gap:12px; }
    .now-playing.visible { display:flex; }
    .now-playing-dot { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px rgba(200,151,60,.7); animation:pulse 1.4s ease-in-out infinite; flex-shrink:0; }
    .now-playing-info { flex:1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .now-playing-icon { font-size:20px; }
    .now-playing-name { font-family:'Cinzel',serif; font-size:15px; font-weight:600; color:var(--text); }
    .now-playing-meta { font-size:11px; color:var(--muted); }
    .music-intro { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:20px; font-size:13px; color:var(--muted); line-height:1.6; }
    .mood-card-icon { font-size:34px; margin-bottom:8px; }
    .mood-card-name { font-family:'Cinzel',serif; font-size:13px; font-weight:700; color:var(--text); margin-bottom:4px; }
    .mood-card-desc { font-size:11px; color:var(--muted); line-height:1.4; margin-bottom:4px; }
    .mood-card-meta { font-size:10px; color:var(--muted); background:var(--surf2); border:1px solid var(--border); border-radius:4px; padding:2px 7px; display:inline-block; }
    .mood-card-playing { display:none; align-items:center; gap:5px; margin-top:8px; font-size:10px; color:var(--accent); justify-content:center; }
    .mood-card-playing span { width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; animation:pulse 1.4s ease-in-out infinite; }
    .mood-card.active .mood-card-playing { display:flex; }
    .volume-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-top:20px; }
    .volume-label { color:var(--muted); font-size:13px; }
    .volume-slider { accent-color:var(--accent); cursor:pointer; flex:1; min-width:120px; }
    .volume-val { font-size:12px; color:var(--muted); min-width:48px; }

    /* Encounter saved list */
    .enc-saved-list { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
    .enc-brief-header-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .enc-brief-xp { font-family:'Cinzel',serif; font-size:18px; font-weight:700; color:var(--accent); }
    .enc-brief-party { font-size:11px; color:var(--muted); }
    .tracker-wrap { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-top:20px; }
    .tracker-header { background:var(--surf2); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:12px; }
    .tracker-title { font-family:'Cinzel',serif; font-size:16px; font-weight:700; color:var(--text); flex:1; }
    .tracker-round { background:var(--accent); color:#0e0c09; font-size:11px; font-weight:800; padding:3px 10px; border-radius:10px; }

    /* Map v2 classes */
    .map-type-pills { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .map-type-pill { background:none; border:1px solid var(--border); color:var(--muted); padding:6px 14px; border-radius:20px; cursor:pointer; font-size:12px; font-weight:600; transition:all .15s; display:inline-flex; align-items:center; gap:5px; }
    .map-type-pill:hover { border-color:var(--accent); color:var(--text); }
    .map-type-pill.active { background:rgba(200,151,60,.12); border-color:var(--accent); color:var(--accent); }
    .map-sub-chip { display:inline-block; background:var(--surf2); border:1px solid var(--border); color:var(--muted); font-size:11px; padding:3px 10px; border-radius:12px; cursor:pointer; transition:all .15s; margin:2px; }
    .map-sub-chip:hover { border-color:var(--accent); color:var(--text); }
    .map-sub-chip.active { background:rgba(200,151,60,.12); border-color:var(--accent); color:var(--accent); }
    .map-frame-header { background:var(--surf2); border-bottom:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
    .map-saved-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:16px; }

    /* btn-purple */
    .btn-purple { background:rgba(139,76,158,.2); border:1px solid rgba(139,76,158,.4); color:var(--purp2); }
    .btn-purple:hover { background:rgba(139,76,158,.3); border-color:var(--purp2); }

    /* Per-view watermark icons */
    #content[data-view="dashboard"]  .view-header::after { content: '🏰'; }
    #content[data-view="maps"]       .view-header::after { content: '🗺'; }
    #content[data-view="npcs"]       .view-header::after { content: '👥'; }
    #content[data-view="quests"]     .view-header::after { content: '📜'; }
    #content[data-view="encounters"] .view-header::after { content: '⚔'; }
    #content[data-view="combat"]     .view-header::after { content: '🩸'; }
    #content[data-view="lore"]       .view-header::after { content: '📖'; }
    #content[data-view="music"]      .view-header::after { content: '🎵'; }
    #content[data-view="spells"]     .view-header::after { content: '✨'; }
    #content[data-view="rules"]      .view-header::after { content: '📋'; }
  </style>
</head>
<body>

<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <div id="content"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-buttons"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/gen.js"></script>
<script src="js/app.js"></script>
<script src="js/music.js"></script>
</body>
</html>
