<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D Campaign Generator — Wildemount DM Toolkit</title>
  <meta name="description" content="Full Dungeon Master toolkit for Wildemount and Exandria. Procedural maps, live synthesised music, NPC generator, encounter builder, initiative tracker, and deep Wildemount lore — all local, no server.">
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0c0a;
      --surface: #1a1612;
      --surf2:   #221d17;
      --border:  #3d2f22;
      --border2: #2a2118;
      --accent:  #c8973c;
      --gold:    #f0c040;
      --purple:  #8b4c9e;
      --purp2:   #b06ccc;
      --text:    #d4c5a9;
      --muted:   #7d6b55;
      --ok:      #3fb950;
      --warn:    #d29922;
      --crit:    #c84040;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.5; height: 100vh; overflow: hidden; }

    /* ── Layout ── */
    #app { display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 210px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    #main { flex: 1; overflow-y: auto; }
    #content { max-width: 1000px; margin: 0 auto; padding: 24px 24px 80px; }

    /* ── Sidebar ── */
    .sidebar-top { padding: 16px 14px 12px; border-bottom: 1px solid var(--border); }
    .sidebar-brand { font-size: 16px; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
    .camp-selector-wrap { margin-top: 4px; }
    .camp-select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .camp-select:focus { outline: none; border-color: var(--accent); }

    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
    .nav-item { display: block; padding: 9px 16px; color: var(--muted); text-decoration: none; cursor: pointer; font-size: 13px; font-weight: 500; border-left: 3px solid transparent; transition: all .15s; user-select: none; }
    .nav-item:hover { color: var(--text); background: var(--surf2); }
    .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(200,151,60,.07); }
    .nav-combat { color: var(--crit) !important; }
    .nav-combat.active { border-left-color: var(--crit) !important; }

    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
    #music-mini { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 24px; }
    .mini-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .mini-dot.playing { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
    .mini-label { font-size: 12px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-stop { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px; }
    .mini-stop:hover { color: var(--crit); }
    .btn-new-camp { width: 100%; background: var(--surf2); border: 1px solid var(--border); color: var(--muted); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all .15s; }
    .btn-new-camp:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: all .15s; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg,var(--accent),#a07020); color: #0e0c0a; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary { background: var(--surf2); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: #3a0a0a; border: 1px solid #5a1a1a; color: var(--crit); }
    .btn-danger:hover { background: #5a0a0a; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-lg { padding: 13px 28px; font-size: 15px; }
    .btn-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }
    .btn-link:hover { text-decoration: underline; }
    .btn-icon { background: none; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 12px; }
    .btn-danger-icon { color: var(--muted); }
    .btn-danger-icon:hover { color: var(--crit); }

    /* ── Forms ── */
    .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    .form-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; width: 100%; }
    .form-input:focus { outline: none; border-color: var(--accent); }
    .form-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .form-select:focus { outline: none; border-color: var(--accent); }
    .form-textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; width: 100%; resize: vertical; min-height: 100px; }
    .form-textarea:focus { outline: none; border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }

    /* ── Views ── */
    .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
    .view-header h1 { font-size: 22px; font-weight: 800; color: var(--text); margin: 0; }
    .view-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; }
    .section-hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ── Welcome ── */
    .welcome-wrap { display: flex; align-items: center; justify-content: center; min-height: 70vh; }
    .welcome-box { text-align: center; max-width: 480px; }
    .welcome-icon { font-size: 52px; margin-bottom: 16px; }
    .welcome-title { font-size: 28px; font-weight: 900; color: var(--gold); margin-bottom: 12px; }
    .welcome-sub { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 28px; }

    /* ── Dashboard ── */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 10px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 12px; text-align: center; }
    .stat-num { font-size: 24px; font-weight: 800; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .dash-grid { grid-template-columns: 1fr; } }
    .dash-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--text); }
    .dash-btn { display: block; width: 100%; margin-bottom: 8px; text-align: left; }

    /* ── List rows ── */
    .list-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border2); border-radius: 6px; margin-bottom: 6px; cursor: pointer; gap: 12px; }
    .list-row:hover { border-color: var(--border); }
    .list-name { font-weight: 600; color: var(--text); font-size: 13px; }
    .list-meta { font-size: 11px; color: var(--muted); }
    .empty-msg { color: var(--muted); font-size: 13px; font-style: italic; padding: 8px 0; }

    /* ── Tags ── */
    .tag-ok   { background: #0a1a0a; color: var(--ok);   border: 1px solid #1a3a1a; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .tag-warn { background: #1a1200; color: var(--warn);  border: 1px solid #3a2a00; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .tag-crit { background: #1a0000; color: var(--crit);  border: 1px solid #3a1010; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .tag-muted{ background: var(--surf2); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; }

    /* ── Gen controls ── */
    .gen-controls { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .gen-field { display: flex; flex-direction: column; }

    /* ── Map ── */
    .map-controls { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .map-wrap { background: #050403; border: 1px solid var(--border); border-radius: 10px; overflow: auto; padding: 12px; }
    .map-placeholder { color: var(--muted); font-size: 13px; font-style: italic; padding: 40px; text-align: center; }
    .map-title { color: var(--accent); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .map-legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    .legend-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .token-toolbar { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 4px; }
    .token-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .token-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; min-width: 42px; }
    .token-hint { font-size: 11px; color: var(--accent); margin-top: 2px; }
    .token-btn { padding: 4px 11px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 12px; transition: border-color .15s, background .15s; }
    .token-btn:hover { border-color: var(--accent); }
    .token-btn[data-type="player"] { border-color: #c8a018; color: #c8a018; }
    .token-btn[data-type="enemy"]  { border-color: #c42020; color: #c42020; }
    .token-btn[data-type="npc"]    { border-color: #2060c8; color: #2060c8; }
    .token-btn[data-type="reveal"] { border-color: #b08000; color: #d0a820; }
    .token-btn[data-type="hide"]   { border-color: #5058a8; color: #8088d8; }
    .token-btn.active { background: rgba(255,255,255,0.08); filter: brightness(1.28); }
    .token-btn-clear { color: var(--muted) !important; border-color: var(--border) !important; }

    /* ── Avatar picker ── */
    .avatar-strip { display: flex; flex-wrap: wrap; gap: 3px; }
    .avatar-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; font-size: 15px; padding: 1px 4px; cursor: pointer; line-height: 1.5; transition: border-color .12s, background .12s; }
    .avatar-btn:hover { border-color: var(--accent); background: var(--surf2); }
    .avatar-btn.active { border-color: var(--accent); background: rgba(200,151,60,.18); box-shadow: 0 0 6px rgba(200,151,60,.3); }

    /* ── Map HUD ── */
    .map-hud { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; margin: 6px 0; }
    .hud-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .hud-section { display: flex; align-items: center; gap: 5px; }
    .hud-flex { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .hud-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
    .hud-num { font-size: 20px; font-weight: 800; color: var(--gold); min-width: 26px; text-align: center; line-height: 1; }
    .hud-btn { background: var(--surf2); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 5px; cursor: pointer; }
    .hud-btn:hover { border-color: var(--accent); color: var(--accent); }
    .hud-del:hover { border-color: var(--crit) !important; color: var(--crit) !important; }
    .hud-add { background: none; border: 1px dashed var(--border); color: var(--muted); font-size: 11px; padding: 2px 9px; border-radius: 5px; cursor: pointer; }
    .hud-add:hover { border-color: var(--accent); color: var(--accent); }
    .hud-divider { width: 1px; height: 22px; background: var(--border); }
    .hud-timer { display: flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
    .hud-timer.hud-warn   { border-color: var(--warn); }
    .hud-timer.hud-urgent { border-color: var(--crit); animation: pulse .8s ease-in-out infinite; }
    .hud-timer-name, .hud-counter-name { font-size: 10px; color: var(--muted); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hud-timer-time { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; min-width: 36px; text-align: center; }
    .hud-timer-bar-wrap { width: 44px; height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; border: 1px solid var(--border2); }
    .hud-timer-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1s linear; }
    .hud-counter { display: flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }

    /* ── Music ── */
    .music-now { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; min-height: 40px; }
    .now-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .now-dot.playing { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
    .mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 12px; margin-bottom: 20px; }
    .mood-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px 14px 16px; cursor: pointer; transition: all .16s; text-align: center; user-select: none; position: relative; }
    .mood-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
    .mood-card.active  { border-color: var(--gold); background: #1a1200; box-shadow: 0 0 24px rgba(240,192,64,.15); }
    .mood-card.theme-warm.active    { border-color: #f0a030; background: #1a1200; box-shadow: 0 0 24px rgba(240,160,48,.22); }
    .mood-card.theme-red.active     { border-color: #c84040; background: #1a0a0a; box-shadow: 0 0 26px rgba(200,64,64,.25); }
    .mood-card.theme-crimson.active { border-color: #a01818; background: #160606; box-shadow: 0 0 28px rgba(160,24,24,.28); }
    .mood-card.theme-green.active   { border-color: #3a8a3a; background: #0a150a; box-shadow: 0 0 24px rgba(58,138,58,.22); }
    .mood-card.theme-purple.active  { border-color: var(--purp2); background: #130a1e; box-shadow: 0 0 26px rgba(176,108,204,.28); }
    .mood-card.theme-void.active    { border-color: #6060a0; background: #080810; box-shadow: 0 0 28px rgba(96,96,160,.22); }
    .mood-card.theme-gold.active    { border-color: var(--gold); background: #1a1400; box-shadow: 0 0 32px rgba(240,192,64,.30); }
    .mood-card.loading { border-color: var(--accent); opacity: .75; pointer-events: none; }
    .mood-bpm { position: absolute; top: 8px; right: 8px; font-size: 10px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; }
    .mood-icon { font-size: 28px; margin-bottom: 7px; }
    .mood-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .mood-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .mood-inst { font-size: 10px; color: var(--border); margin-top: 5px; letter-spacing: 0.04em; }
    .music-vol-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .music-vol-row label { color: var(--muted); font-size: 12px; }
    input[type=range] { accent-color: var(--accent); cursor: pointer; width: 100px; }
    .vol-label { font-size: 12px; color: var(--muted); min-width: 45px; }

    /* ── Stat block ── */
    .stat-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .sb-name { font-size: 18px; font-weight: 800; color: var(--text); }
    .sb-sub { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .sb-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
    .sb-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; margin-bottom: 4px; }
    .sb-key { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
    .sb-stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .sb-stat { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; text-align: center; min-width: 52px; }
    .sb-sval { font-size: 18px; font-weight: 800; color: var(--text); }
    .sb-smod { font-size: 13px; color: var(--accent); }
    .sb-skey { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

    /* ── Info cards ── */
    .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .ic-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .ic-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 13px; flex-wrap: wrap; }
    .ic-key { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; flex-shrink: 0; }

    /* ── Quests ── */
    .quest-row { cursor: default; }
    .quest-row:hover { border-color: var(--border); }

    /* ── Combat tracker ── */
    .combat-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .combat-header h1 { font-size: 20px; font-weight: 800; margin: 0; }
    .combat-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .combat-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .active-banner { background: #201800; border: 1px solid var(--accent); border-radius: 6px; padding: 7px 14px; font-size: 13px; color: var(--gold); margin-bottom: 14px; }

    .combatant-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; margin-bottom: 8px; transition: all .15s; }
    .combatant-active { background: #1c1400; border-color: var(--accent) !important; box-shadow: 0 0 18px rgba(200,151,60,.12); }
    .combatant-dead { opacity: .45; }

    .cr-init { text-align: center; min-width: 38px; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
    .cr-init:hover { background: var(--surf2); }
    .cr-init-num { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1; }
    .cr-init-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    .cr-body { flex: 1; min-width: 0; }
    .cr-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
    .cr-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .cr-player { color: var(--accent); }
    .cr-player-label { background: #1a1200; color: var(--accent); border: 1px solid var(--border); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
    .cr-meta { font-size: 11px; color: var(--muted); }
    .cr-active-badge { background: #2a1a00; color: var(--gold); border: 1px solid #4a3000; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .cr-dead-badge { background: #1a0000; color: var(--crit); border: 1px solid #3a1010; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }

    .cr-mid { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .cr-hp-area { display: flex; flex-direction: column; gap: 3px; }
    .cr-hp-text { font-size: 13px; font-weight: 600; color: var(--text); }
    .cr-hp-crit { color: var(--crit); }
    .cr-hp-low  { color: var(--warn); }
    .cr-hp-bar-wrap { width: 140px; height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; }
    .cr-hp-bar { height: 100%; border-radius: 3px; transition: width .3s; }
    .hp-ok   { background: linear-gradient(90deg, var(--ok), #2a7a3a); }
    .hp-low  { background: linear-gradient(90deg, var(--warn), #a07010); }
    .hp-crit { background: linear-gradient(90deg, var(--crit), #8a1010); }
    .cr-ac { font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }

    .cr-conds { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .cond-tag { background: #2a1a0a; border: 1px solid var(--border); color: var(--warn); font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; }
    .cond-tag:hover { color: var(--crit); border-color: var(--crit); }
    .cond-add { background: none; border: 1px dashed var(--border); color: var(--muted); font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; }
    .cond-add:hover { border-color: var(--accent); color: var(--accent); }
    .cr-note { font-size: 11px; color: var(--muted); font-style: italic; }

    .cr-btns { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .cr-btn { background: var(--bg); border: 1px solid var(--border); color: var(--muted); font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 5px; cursor: pointer; transition: all .12s; white-space: nowrap; }
    .cr-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cr-btn-heal:hover { border-color: var(--ok); color: var(--ok); }
    .cr-btn-dmg:hover  { border-color: var(--crit); color: var(--crit); }
    .cr-btn-del:hover  { border-color: var(--crit); color: var(--crit); }

    .cond-picker { display: flex; flex-wrap: wrap; gap: 8px; }
    .cond-pick-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
    .cond-pick-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Lore ── */
    .lore-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .lore-tab { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .lore-tab:hover { color: var(--text); border-color: var(--accent); }
    .lore-tab.active { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .lore-section-title { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 10px; }
    .deity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 8px; }
    .deity-card { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; }
    .deity-name { font-weight: 700; color: var(--text); font-size: 13px; }
    .deity-domain { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .deity-align { font-size: 11px; color: var(--accent); margin-top: 2px; }
    .lore-list { list-style: none; }
    .lore-list li { padding: 5px 0; border-bottom: 1px solid var(--border2); font-size: 13px; color: var(--muted); }
    .lore-list li:last-child { border-bottom: none; }
    .plot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
    .plot-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .plot-num { color: var(--accent); font-weight: 800; font-size: 16px; margin-bottom: 6px; }
    .plot-card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .name-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .name-item { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 13px; padding: 6px 12px; border-radius: 6px; }

    /* ── NPC Cards ── */
    .npc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .npc-card-compact { margin: 0 0 4px; border-radius: 0 0 10px 10px; border-top: none; }
    .npc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; background: rgba(255,255,255,.03); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .npc-name { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 3px; }
    .npc-sub { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .npc-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .npc-combat-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
    .npc-combat-stat { flex: 1; text-align: center; padding: 8px 4px; border-right: 1px solid var(--border2); }
    .npc-combat-stat:last-child { border-right: none; }
    .npc-combat-val { font-size: 16px; font-weight: 800; color: var(--text); }
    .npc-combat-key { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .npc-stat-row { display: flex; border-bottom: 1px solid var(--border); }
    .npc-stat-cell { flex: 1; text-align: center; padding: 8px 4px; border-right: 1px solid var(--border2); }
    .npc-stat-cell:last-child { border-right: none; }
    .npc-stat-val { font-size: 14px; font-weight: 700; color: var(--text); }
    .npc-stat-mod { font-size: 13px; color: var(--accent); font-weight: 600; }
    .npc-stat-key { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
    .npc-stat-save { font-size: 10px; color: var(--muted); }
    .npc-skills-row { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 14px; border-bottom: 1px solid var(--border); align-items: center; }
    .npc-skills-label { font-size: 10px; text-transform: uppercase; color: var(--muted); margin-right: 4px; letter-spacing: .04em; }
    .npc-skill-tag { background: rgba(138,180,248,.1); border: 1px solid rgba(138,180,248,.2); color: var(--accent); font-size: 10px; padding: 1px 6px; border-radius: 3px; }
    .npc-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
    .npc-section { }
    .npc-section-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 7px; display: flex; align-items: center; gap: 6px; }
    .npc-text { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
    .npc-trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .npc-trait { background: rgba(255,255,255,.025); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 11px; }
    .npc-trait-flaw { border-color: rgba(231,76,60,.25); background: rgba(231,76,60,.04); }
    .npc-trait-key { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
    .npc-trait-val { font-size: 12px; color: var(--text); line-height: 1.5; }
    .npc-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .npc-two-col { grid-template-columns: 1fr; } .npc-trait-grid { grid-template-columns: 1fr; } }
    .npc-secret-block { background: rgba(231,76,60,.04); border: 1px solid rgba(231,76,60,.18); border-radius: 8px; padding: 10px 12px; }
    .npc-equip-list { margin: 8px 0 0; padding-left: 16px; display: flex; flex-direction: column; gap: 3px; }
    .npc-equip-list li { font-size: 12px; color: var(--muted); }
    .npc-dm-note { background: rgba(231,76,60,.04); border: 1px solid rgba(231,76,60,.18); border-radius: 8px; padding: 10px 12px; }

    /* ── Quest Cards ── */
    .quest-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .quest-card-compact { margin: 0 0 4px; border-radius: 0 0 10px 10px; border-top: none; }
    .quest-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; background: rgba(255,255,255,.03); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .quest-header > div:first-child { display: flex; gap: 14px; align-items: flex-start; flex: 1; min-width: 0; }
    .quest-icon { font-size: 28px; line-height: 1; flex-shrink: 0; margin-top: 2px; }
    .quest-title { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
    .quest-meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .quest-chip { background: rgba(138,180,248,.1); border: 1px solid rgba(138,180,248,.2); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 4px; }
    .quest-urgency { font-size: 11px; color: var(--muted); font-style: italic; }
    .quest-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; }
    .quest-section { }
    .quest-section-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .quest-dm-tag { background: rgba(231,76,60,.18); color: #e74c3c; font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 700; letter-spacing: .04em; }
    .quest-text { font-size: 13px; color: var(--muted); line-height: 1.65; margin: 0; }
    .quest-npc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 10px; }
    .quest-npc-card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .quest-npc-villain { border-color: rgba(231,76,60,.35); background: rgba(231,76,60,.05); }
    .quest-npc-ally { border-color: rgba(46,204,113,.3); background: rgba(46,204,113,.04); }
    .quest-npc-role { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
    .quest-npc-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
    .quest-npc-title { font-size: 11px; color: var(--accent); margin-bottom: 6px; }
    .quest-npc-desc { font-size: 12px; color: var(--muted); margin: 0 0 6px; line-height: 1.5; }
    .quest-npc-secret { font-size: 11px; color: var(--muted); border-top: 1px solid var(--border2); padding-top: 6px; margin-top: 2px; line-height: 1.4; }
    .quest-acts { display: flex; flex-direction: column; gap: 10px; }
    .quest-act { background: rgba(255,255,255,.025); border: 1px solid var(--border2); border-radius: 8px; padding: 12px 14px; }
    .quest-act-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .quest-act-num { background: var(--accent); color: #000; font-size: 10px; font-weight: 900; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .quest-act-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .quest-act-loc { font-size: 11px; color: var(--muted); }
    .quest-encounter-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; background: rgba(0,0,0,.15); border-radius: 5px; padding: 6px 8px; }
    .enc-tag { background: rgba(255,255,255,.06); border: 1px solid var(--border2); font-size: 11px; color: var(--text); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .quest-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .quest-two-col { grid-template-columns: 1fr; } }
    .quest-list { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 6px; }
    .quest-list li { font-size: 12px; color: var(--muted); line-height: 1.55; }
    .quest-resolutions { display: flex; flex-direction: column; gap: 8px; }
    .quest-resolution { background: rgba(255,255,255,.025); border: 1px solid var(--border2); border-radius: 7px; padding: 10px 12px; }
    .quest-resolution-name { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .quest-rewards { background: rgba(138,180,248,.06); border: 1px solid rgba(138,180,248,.2); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .quest-reward-row { display: flex; gap: 10px; font-size: 12px; }
    .quest-reward-key { color: var(--accent); font-weight: 700; min-width: 60px; flex-shrink: 0; }
    .quest-reward-row span:last-child { color: var(--muted); line-height: 1.5; }
    .quest-dm-notes { background: rgba(231,76,60,.05); border: 1px solid rgba(231,76,60,.2); border-radius: 8px; padding: 12px 14px; }
    .quest-row { cursor: pointer; }
    .quest-row:hover { background: rgba(255,255,255,.04); }

    /* ── Spells ── */
    .spell-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; margin-bottom: 8px; }
    .spell-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: border-color .2s; }
    .spell-card:hover { border-color: var(--accent); }
    .spell-card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .spell-name { font-weight: 700; font-size: 14px; color: var(--text); }
    .spell-school { font-size: 11px; font-weight: 600; text-transform: capitalize; }
    .spell-meta { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .spell-classes { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .spell-class-tag { background: rgba(138,180,248,.12); border: 1px solid rgba(138,180,248,.25); color: var(--accent); font-size: 10px; padding: 1px 6px; border-radius: 3px; }
    .spell-desc { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .spell-card.expanded .spell-desc { display: block; -webkit-line-clamp: unset; }
    .spell-components { font-style: italic; }

    /* ── Rules Reference ── */
    .rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; }
    .rule-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .rule-name { font-weight: 700; font-size: 14px; color: var(--accent); margin-bottom: 6px; }
    .rule-desc { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 0; }
    .rules-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rules-table th { text-align: left; color: var(--muted); border-bottom: 1px solid var(--border); padding: 6px 8px; font-weight: 600; }
    .rules-table td { padding: 7px 8px; border-bottom: 1px solid var(--border2); color: var(--text); }
    .rules-table tr:last-child td { border-bottom: none; }

    /* ── Modal ── */
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    #modal-overlay.hidden { display: none; }
    #modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    #modal-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 16px; }
    #modal-body { margin-bottom: 16px; }
    #modal-body label { display: block; margin-top: 12px; }
    #modal-body label:first-child { margin-top: 0; }
    #modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* ── Toast ── */
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--accent); color: var(--accent); padding: 8px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 2000; }
    #toast.show { opacity: 1; }

    /* ── Responsive sidebar ── */
    @media (max-width: 600px) {
      #sidebar { width: 160px; }
      .nav-item { font-size: 12px; padding: 8px 12px; }
    }
    @media (max-width: 480px) {
      #sidebar { display: none; }
      #content { padding: 16px; }
    }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

<div id="app">
  <aside id="sidebar"></aside>
  <div id="main">
    <div id="content"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-buttons"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/gen.js"></script>
<script src="js/app.js"></script>
<script src="js/music.js"></script>
</body>
</html>
