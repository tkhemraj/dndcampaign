<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>D&D Campaign Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="/static/styles.css"/>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
</head>
<body>

  <nav id="sidebar">

    <!-- Brand -->
    <div id="logo">
      <div id="logo-emblem">⚔</div>
      <div id="logo-wordmark">
        <span id="logo-name">Campaign</span>
        <span id="logo-sub">Generator</span>
      </div>
    </div>

    <!-- Scrollable body -->
    <div id="sidebar-body">

      <!-- Campaign selector -->
      <div id="campaign-wrap">
        <div class="sb-section-label">Campaign</div>
        <div id="campaign-select-wrap">
          <select id="campaign-select"><option value="">— Select Campaign —</option></select>
          <button id="btn-new-campaign">+ New Campaign</button>
        </div>
      </div>

      <!-- Navigation -->
      <div class="sb-section-label" style="margin-top:8px">Navigate</div>
      <ul id="nav-links">
        <li data-view="dashboard" class="active">
          <span class="nav-icon">🏰</span><span class="nav-label">Dashboard</span>
        </li>
        <li data-view="maps">
          <span class="nav-icon">🗺</span><span class="nav-label">Maps</span>
        </li>
        <li data-view="npcs">
          <span class="nav-icon">👥</span><span class="nav-label">NPCs</span>
        </li>
        <li data-view="quests">
          <span class="nav-icon">📜</span><span class="nav-label">Quests</span>
        </li>
        <li data-view="encounters">
          <span class="nav-icon">⚔</span><span class="nav-label">Encounters</span>
        </li>
        <li data-view="lore">
          <span class="nav-icon">📖</span><span class="nav-label">Lore</span>
        </li>
        <li data-view="music">
          <span class="nav-icon">🎵</span><span class="nav-label">Music</span>
        </li>
      </ul>

    </div><!-- /#sidebar-body -->

    <!-- Footer: player share + music mini -->
    <div id="sidebar-footer">
      <div class="sb-section-label">Player</div>
      <button id="player-link">
        <span class="nav-icon">🔗</span><span class="nav-label">Share Player View</span>
      </button>
      <div id="music-mini">
        <div id="music-mini-dot"></div>
        <div id="music-mini-label">♪ —</div>
        <button id="btn-music-toggle">▶</button>
      </div>
    </div>

  </nav>

  <main id="content">
    <!-- Views injected by JS -->
  </main>

  <div id="toast-container"></div>

  <!-- Confirm dialog -->
  <div id="confirm-overlay" class="hidden">
    <div id="confirm-dialog">
      <p id="confirm-msg"></p>
      <div id="confirm-actions">
        <button class="btn btn-secondary" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger"    id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/static/views/dashboard.js"></script>
  <script src="/static/views/maps.js"></script>
  <script src="/static/views/npcs.js"></script>
  <script src="/static/views/quests.js"></script>
  <script src="/static/views/encounters.js"></script>
  <script src="/static/views/lore.js"></script>
  <script src="/static/views/music.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
